[project]
name = "zhixing-data-hub-workspace"
version = "0.1.0"
description = "知行数枢 Python workspace baseline"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "mcp/enterprise-gateway",
  "packages/agent-runtime",
  "packages/jobs",
  "packages/connectors",
  "packages/observability",
  "services/adapters/codex-runtime",
  "services/api",
  "services/mock-commerce",
  "services/mock-memory",
  "services/mock-knowledge",
  "services/worker",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
