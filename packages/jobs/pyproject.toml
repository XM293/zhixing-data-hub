[project]
name = "zhixing-jobs"
version = "0.1.0"
description = "知行数枢 PostgreSQL 后台任务契约与执行基础"
requires-python = ">=3.11,<3.14"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "zhixing-observability",
]

[tool.uv.sources]
zhixing-observability = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixing_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
