[project]
name = "zhixing-connectors"
version = "0.1.0"
description = "Shared read-only external source connector protocols"
requires-python = ">=3.11,<3.14"
dependencies = ["cryptography>=44,<51", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhixing_connectors"]
include = ["src/zhixing_connectors/py.typed", "src/zhixing_connectors/*.json"]
