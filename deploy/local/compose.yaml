name: zhixing-data-hub

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhixing}
      POSTGRES_USER: ${POSTGRES_USER:-zhixing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhixing_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhixing} -d ${POSTGRES_DB:-zhixing}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - zhixing-postgres:/var/lib/postgresql/data

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-zhixing}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-zhixing_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - zhixing-minio:/data

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-zhixing}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-zhixing_dev_only}
      S3_BUCKET: ${S3_BUCKET:-zhixing-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    profiles: ["redis"]
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    volumes:
      - zhixing-redis:/data

volumes:
  zhixing-postgres:
  zhixing-minio:
  zhixing-redis:
